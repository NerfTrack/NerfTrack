name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-14
            experimental: false
          - name: macOS Intel x86_64
            os: macos-15-intel
            experimental: false
          - name: Windows Intel x86_64
            os: windows-latest
            experimental: false
          - name: Windows ARM64 (preview)
            os: windows-11-arm
            experimental: true
          - name: Linux x86_64
            os: ubuntu-24.04
            experimental: false
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            experimental: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, checked 2026-07-23
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Rust gates
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned app artifacts
        if: runner.os != 'Linux'
        run: npm run tauri:build
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run tauri:build -- --bundles appimage,deb,rpm
      - name: Check patch whitespace
        run: git diff --check
      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nerftrack-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: error
