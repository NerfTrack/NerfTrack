name: Release installers

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semver tag to rebuild from this workflow's ref
        required: true
        default: v0.5.0
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-14
            platform: macos
            rust_target: aarch64-apple-darwin
            dmg_arch: aarch64
            bundle_path: 'src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg'
            asset_suffix: macos-arm64.dmg
          - name: macOS Intel x86_64
            os: macos-15-intel
            platform: macos
            rust_target: x86_64-apple-darwin
            dmg_arch: x86_64
            bundle_path: 'src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg'
            asset_suffix: macos-x86_64.dmg
          - name: Windows x64
            os: windows-latest
            platform: windows
            rust_target: x86_64-pc-windows-msvc
            bundle_path: 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe'
            asset_suffix: windows-x64-setup.exe
          - name: Windows ARM64
            os: windows-11-arm
            platform: windows
            rust_target: aarch64-pc-windows-msvc
            bundle_path: 'src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe'
            asset_suffix: windows-arm64-setup.exe
          - name: Linux x86_64 AppImage
            os: ubuntu-24.04
            platform: linux
            rust_target: x86_64-unknown-linux-gnu
            bundle_type: appimage
            bundle_path: 'src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage'
            asset_suffix: linux-x86_64.AppImage
          - name: Linux x86_64 DEB
            os: ubuntu-24.04
            platform: linux
            rust_target: x86_64-unknown-linux-gnu
            bundle_type: deb
            bundle_path: 'src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb'
            asset_suffix: linux-x86_64.deb
          - name: Linux x86_64 RPM
            os: ubuntu-24.04
            platform: linux
            rust_target: x86_64-unknown-linux-gnu
            bundle_type: rpm
            bundle_path: 'src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm'
            asset_suffix: linux-x86_64.rpm
          - name: Linux ARM64 AppImage
            os: ubuntu-24.04-arm
            platform: linux
            rust_target: aarch64-unknown-linux-gnu
            bundle_type: appimage
            bundle_path: 'src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage'
            asset_suffix: linux-arm64.AppImage
          - name: Linux ARM64 DEB
            os: ubuntu-24.04-arm
            platform: linux
            rust_target: aarch64-unknown-linux-gnu
            bundle_type: deb
            bundle_path: 'src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb'
            asset_suffix: linux-arm64.deb
          - name: Linux ARM64 RPM
            os: ubuntu-24.04-arm
            platform: linux
            rust_target: aarch64-unknown-linux-gnu
            bundle_type: rpm
            bundle_path: 'src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm'
            asset_suffix: linux-arm64.rpm

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The release build uses the Rust parser in this repository and does
          # not need the documentation-only ccusage submodule. Avoid making
          # installers depend on an unrelated submodule checkout.
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable, checked 2026-07-23
        with:
          toolchain: stable
          target: ${{ matrix.rust_target }}
          components: rustfmt, clippy

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          node -e "const fs=require('fs'); const version=process.argv[1]; const packageJson=JSON.parse(fs.readFileSync('package.json')); const tauri=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')); if (packageJson.version !== version || tauri.version !== version) { console.error({tag: version, package: packageJson.version, tauri: tauri.version}); process.exit(1); }" "$version"
          cargo_version="$(awk '/^name = "nerftrack"$/{found=1; next} found && /^version = /{print $3; exit}' src-tauri/Cargo.lock | tr -d '"')"
          test "$cargo_version" = "$version"

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Rust gates
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build macOS app bundle
        if: matrix.platform == 'macos'
        run: npm run tauri:build -- --target "${{ matrix.rust_target }}" --bundles app --no-sign

      - name: Seal macOS app bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app_bundle="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/NerfTrack.app"
          test -d "$app_bundle"
          /usr/bin/codesign --force --deep --sign - "$app_bundle"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app_bundle"
          test -f "$app_bundle/Contents/_CodeSignature/CodeResources"

      - name: Create macOS DMG from sealed app
        if: matrix.platform == 'macos'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          DMG_ARCH: ${{ matrix.dmg_arch }}
        run: |
          set -euo pipefail
          app_bundle="src-tauri/target/${RUST_TARGET}/release/bundle/macos/NerfTrack.app"
          dmg_dir="src-tauri/target/${RUST_TARGET}/release/bundle/dmg"
          dmg_path="$dmg_dir/NerfTrack_${RELEASE_TAG#v}_${DMG_ARCH}.dmg"
          staging_dir="$(mktemp -d)"
          test -d "$app_bundle"
          mkdir -p "$dmg_dir"
          /usr/bin/ditto "$app_bundle" "$staging_dir/NerfTrack.app"
          ln -s /Applications "$staging_dir/Applications"
          /usr/bin/hdiutil create \
            -volname NerfTrack \
            -srcfolder "$staging_dir" \
            -ov \
            -format UDZO \
            "$dmg_path"
          test -s "$dmg_path"

      - name: Verify macOS DMG app signature
        if: matrix.platform == 'macos'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          DMG_ARCH: ${{ matrix.dmg_arch }}
        run: |
          set -euo pipefail
          dmg_path="src-tauri/target/${RUST_TARGET}/release/bundle/dmg/NerfTrack_${RELEASE_TAG#v}_${DMG_ARCH}.dmg"
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          /usr/bin/hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_dir" >/dev/null
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$mount_dir/NerfTrack.app"
          test -f "$mount_dir/NerfTrack.app/Contents/_CodeSignature/CodeResources"

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: npm run tauri:build -- --target "${{ matrix.rust_target }}" --bundles nsis

      - name: Build Linux package
        if: matrix.platform == 'linux'
        run: npm run tauri:build -- --target "${{ matrix.rust_target }}" --bundles "${{ matrix.bundle_type }}"

      - name: Normalize architecture-specific artifact name
        shell: bash
        env:
          ASSET_GLOB: ${{ matrix.bundle_path }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail
          bundle_dir="${ASSET_GLOB%/*}"
          bundle_pattern="${ASSET_GLOB##*/}"
          matches=()
          while IFS= read -r -d '' match; do
            matches[${#matches[@]}]="$match"
          done < <(find "$bundle_dir" -maxdepth 1 -type f -name "$bundle_pattern" -print0)
          if [[ "${#matches[@]}" -ne 1 ]]; then
            printf 'Expected exactly one installer, found %s:\n' "${#matches[@]}" >&2
            printf '%s\n' "${matches[@]}" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          mkdir -p release
          cp "${matches[0]}" "release/NerfTrack-${version}-${ASSET_SUFFIX}"
          test -s "release/NerfTrack-${version}-${ASSET_SUFFIX}"

      - name: Check patch whitespace
        run: git diff --check

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.asset_suffix }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify complete artifact set
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          expected=(
            "release/NerfTrack-${version}-macos-arm64.dmg"
            "release/NerfTrack-${version}-macos-x86_64.dmg"
            "release/NerfTrack-${version}-windows-x64-setup.exe"
            "release/NerfTrack-${version}-windows-arm64-setup.exe"
            "release/NerfTrack-${version}-linux-x86_64.AppImage"
            "release/NerfTrack-${version}-linux-x86_64.deb"
            "release/NerfTrack-${version}-linux-x86_64.rpm"
            "release/NerfTrack-${version}-linux-arm64.AppImage"
            "release/NerfTrack-${version}-linux-arm64.deb"
            "release/NerfTrack-${version}-linux-arm64.rpm"
          )
          for artifact in "${expected[@]}"; do
            test -s "$artifact"
          done
          actual_count="$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$actual_count" = "10"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "NerfTrack ${RELEASE_TAG}" \
              --generate-notes
          fi
