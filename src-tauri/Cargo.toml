[package]
name = "nerftrack"
version = "1.1.6"
description = "NerfTrack local Codex usage monitor"
authors = ["NerfTrack"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"
default-run = "nerftrack"
build = "build.rs"

[profile.release]
strip = "symbols"
codegen-units = 1

[lib]
name = "nerftrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nerftrack"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
dirs = "6"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "stream", "rustls"] }
semver = "1"
tokio = { version = "1", features = ["fs", "io-util"] }
